<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI Browser Agent</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="logo-area">
        <div class="logo-icon">🤖</div>
        <div>
          <h1 class="title">AI Browser Agent</h1>
          <span class="subtitle">Self-Intelligence • Fulfills All Commands</span>
        </div>
      </div>
      <div id="status-pill" class="status-pill idle">Idle</div>
    </header>

    <!-- Notification Banner -->
    <div id="ui-banner" class="ui-banner hidden"></div>

    <!-- API Key & Settings Drawer -->
    <details class="settings-drawer" id="settings-drawer">
      <summary class="settings-summary">
        <span>⚙️ Configuration & API Key</span>
        <span class="chevron">▾</span>
      </summary>
      <div class="settings-content">
        <div class="form-group">
          <div class="label-row">
            <label for="api-key">Gemini API Key (Optional)</label>
            <a href="https://aistudio.google.com/app/apikey" target="_blank" class="link-small">Get Free Key ↗</a>
          </div>
          <div class="input-with-button">
            <input type="password" id="api-key" placeholder="Optional - Leave empty for Free Mode" autocomplete="off">
            <button type="button" id="toggle-key-visibility" class="btn-icon" title="Toggle visibility">👁️</button>
            <button type="button" id="test-key-btn" class="btn-small btn-secondary" title="Verify your API key">Test</button>
            <button type="button" id="save-key-btn" class="btn-small">Save</button>
          </div>
          <div id="key-saved-msg" class="hint-msg hidden">✓ Key saved!</div>
        </div>

        <div class="form-row">
          <div class="form-group flex-1">
            <label for="model-select">AI Mode</label>
            <select id="model-select">
              <option value="free" selected>✨ Free AI (No API Key Needed)</option>
              <option value="gemini-1.5-flash">Gemini 1.5 Flash (Requires Key)</option>
              <option value="gemini-2.0-flash">Gemini 2.0 Flash (Requires Key)</option>
            </select>
          </div>
          <div class="form-group w-80">
            <label for="max-steps">Max Steps</label>
            <input type="number" id="max-steps" value="15" min="3" max="30">
          </div>
        </div>

        <div class="checkbox-row">
          <input type="checkbox" id="show-hud-checkbox" checked>
          <label for="show-hud-checkbox">Show in-page floating status HUD</label>
        </div>
      </div>
    </details>

    <!-- Command Input -->
    <div class="command-section">
      <label for="task-input">Your Command:</label>
      <textarea id="task-input" rows="3" placeholder="E.g., Search Google for latest tech news, or find the price of iPhone 16 on Amazon..."></textarea>
      
      <!-- Quick Chips -->
      <div class="quick-chips">
        <button class="chip" data-task="Search Google for latest tech news today">🔍 Google AI News</button>
        <button class="chip" data-task="Summarize the main content and key takeaways of this page">📄 Summarize Page</button>
        <button class="chip" data-task="Go to Wikipedia and search for Artificial General Intelligence">🌐 Wikipedia AGI</button>
      </div>

      <!-- Action Buttons -->
      <div class="button-group">
        <button id="run-btn" class="btn-primary">
          <span id="run-btn-icon" class="btn-icon-text">🚀</span>
          <span id="run-btn-text">Run Command</span>
        </button>
        <button id="stop-btn" class="btn-danger" disabled>
          <span>🛑</span> Stop
        </button>
      </div>
    </div>

    <!-- Live Execution Status & Feed -->
    <div class="activity-section">
      <div class="section-header">
        <span class="section-title">Execution Activity</span>
        <span id="step-indicator" class="step-badge">Step 0 / 15</span>
      </div>

      <div id="log-container" class="log-container">
        <div class="log-empty">Ready. Enter a command above to start browser automation.</div>
      </div>
    </div>

    <!-- Final Result Box -->
    <div id="result-card" class="result-card hidden">
      <div class="result-header">
        <span id="result-title" class="result-title">🎯 Task Result</span>
        <button id="copy-result-btn" class="btn-link">📋 Copy</button>
      </div>
      <div id="result-content" class="result-content"></div>
    </div>

    <!-- Footer -->
    <footer class="footer">
      <span>AI-Powered Autonomous Browser Agent</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
